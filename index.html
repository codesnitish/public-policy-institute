<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/newlogo.png" />
    <link rel="apple-touch-icon" href="/newlogo.png" />
    <meta property="og:image" content="/newlogo.png" />
    <meta name="twitter:image" content="/newlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Our Gender Lens</title>
    <style>
      html, body, #root, #root * { font-family: "Montserrat", "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif !important; }
    </style>
  </head>
  <body style="font-family: Montserrat, Inter, Segoe UI, Helvetica Neue, Arial, sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      // Auto-open the Identity widget for invite/recovery links.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function () {
          var hash = window.location.hash || '';
          if (
            hash.indexOf('recovery_token=') !== -1 ||
            hash.indexOf('invite_token=') !== -1 ||
            hash.indexOf('confirmation_token=') !== -1
          ) {
            window.netlifyIdentity.open();
          }
        });
        window.netlifyIdentity.init();
      }
    </script>
  </body>
</html>
