<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/newlogo.png" />
    <link rel="apple-touch-icon" href="/newlogo.png" />
    <meta property="og:image" content="/newlogo.png" />
    <meta name="twitter:image" content="/newlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <title>Our Gender Lens</title>
    <style>
      html, body, #root, #root * { font-family: "Montserrat", "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif !important; }
    </style>
    <script>
      // Netlify Identity recovery/invite links land on `/#...token=...`.
      // Make the widget reliably open, and send users to Decap CMS after login.
      (function () {
        function hasIdentityToken() {
          var hash = window.location.hash || '';
          return (
            hash.indexOf('recovery_token=') !== -1 ||
            hash.indexOf('invite_token=') !== -1 ||
            hash.indexOf('confirmation_token=') !== -1
          );
        }

        function initIdentity() {
          if (!window.netlifyIdentity) return;

          window.netlifyIdentity.on('init', function () {
            if (hasIdentityToken()) {
              // Delay a tick so the widget has time to attach its DOM.
              setTimeout(function () { window.netlifyIdentity.open(); }, 0);
            }
          });

          window.netlifyIdentity.on('login', function () {
            if (window.location.pathname !== '/admin/' && window.location.pathname !== '/admin') {
              window.location.href = '/admin/';
            }
          });

          window.netlifyIdentity.init();
        }

        if (document.readyState === 'complete') initIdentity();
        else window.addEventListener('load', initIdentity);
      })();
    </script>
  </head>
  <body style="font-family: Montserrat, Inter, Segoe UI, Helvetica Neue, Arial, sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
