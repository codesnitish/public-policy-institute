backend:
  name: git-gateway
  branch: main

# Allows the CMS to run locally with `npx decap-server` (optional)
local_backend: true

media_folder: "public/blog_data/images"
public_folder: "/blog_data/images"

publish_mode: editorial_workflow

collections:
  - name: "settings"
    label: "Blog Store"
    files:
      - file: "public/blog_data/blogs.json"
        label: "blogs.json"
        name: "blogs_json"
        fields:
          - { label: "Version", name: "version", widget: "number", value_type: "int", min: 1 }
          - { label: "Updated At (YYYY-MM-DD)", name: "updatedAt", widget: "string" }
          - label: "Blogs"
            name: "blogs"
            widget: "list"
            summary: "{{fields.title}} ({{fields.publishedAt}})"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Authors"
                name: "authors"
                widget: "list"
                field: { label: "Author", name: "author", widget: "string" }
              - { label: "Published At (YYYY-MM-DD)", name: "publishedAt", widget: "string" }
              - { label: "Cover Image", name: "coverImageUrl", widget: "image", required: false }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Content (Markdown)", name: "contentMarkdown", widget: "markdown" }
